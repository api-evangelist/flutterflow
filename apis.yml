apis:
- name: FlutterFlow Project APIs
  description: 'REST API for programmatically managing FlutterFlow projects: list projects,
    list and export partitioned project YAML files, validate YAML before applying, and
    update a project by YAML. Used to automate project management and CI/CD. All endpoints
    require a Bearer FlutterFlow API token.'
