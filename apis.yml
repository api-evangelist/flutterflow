aid: flutterflow
name: FlutterFlow
description: 'FlutterFlow is a visual, low-code development platform for building native
  mobile, web, and desktop applications on Flutter without sacrificing app quality or
  features. Beyond the visual builder, FlutterFlow exposes Project APIs — a REST surface
  at api.flutterflow.io/v2 for programmatically listing projects and reading, validating,
  and updating project YAML configuration to automate CI/CD and bulk changes. It ships
  an official command-line client (flutterflow_cli on pub.dev) for exporting Flutter
  code and driving FlutterFlow AI, and an official AI MCP server that lets agents such
  as Claude Code, Gemini CLI, and Codex read and modify FlutterFlow projects using real
  project context. Authentication across the API, CLI, and MCP server is via a Bearer
  FlutterFlow API token.'
